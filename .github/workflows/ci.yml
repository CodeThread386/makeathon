name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check scripts/setup-db.js
          for file in api/*.js api/_lib/*.js; do node --check "$file"; done
      - name: Run configured quality scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          const { scripts = {} } = JSON.parse(await readFile('package.json', 'utf8'));
          for (const name of ['test', 'lint', 'build']) {
            if (!scripts[name]) {
              console.log(`Not configured: ${name}`);
              continue;
            }
            console.log(`Running configured ${name} script`);
            const result = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
      - name: Audit dependencies
        run: npm audit --audit-level=high
